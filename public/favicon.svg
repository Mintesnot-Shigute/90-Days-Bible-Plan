<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Background for visibility -->
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5f1e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8dcc8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Book spine (center) -->
  <rect x="110" y="20" width="36" height="216" fill="#1a0f0a" rx="4"/>
  
  <!-- Left page (back cover) -->
  <rect x="30" y="20" width="80" height="216" fill="#2c1810" stroke="#1a0f0a" stroke-width="2" rx="6"/>
  
  <!-- Right page (front cover) -->
  <rect x="146" y="20" width="80" height="216" fill="url(#pageGradient)" stroke="#1a0f0a" stroke-width="2" rx="6"/>
  
  <!-- Decorative border on front cover -->
  <rect x="158" y="32" width="56" height="192" fill="none" stroke="#c9a876" stroke-width="2" rx="2"/>
  <rect x="162" y="36" width="48" height="184" fill="none" stroke="#c9a876" stroke-width="1" opacity="0.6" rx="1"/>
  
  <!-- Gold cross on front cover -->
  <g transform="translate(186, 128)">
    <!-- Vertical bar of cross -->
    <rect x="-3" y="-28" width="6" height="56" fill="#c9a876" rx="3"/>
    <!-- Horizontal bar of cross -->
    <rect x="-24" y="-3" width="48" height="6" fill="#c9a876" rx="3"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="4" fill="#c9a876"/>
  </g>
  
  <!-- Subtle shine effect on left -->
  <rect x="32" y="22" width="4" height="212" fill="white" opacity="0.15" rx="3"/>
  
  <!-- Book text lines on left page (suggestion of text) -->
  <g opacity="0.3">
    <line x1="40" y1="70" x2="100" y2="70" stroke="#8b6f47" stroke-width="1.5"/>
    <line x1="40" y1="80" x2="100" y2="80" stroke="#8b6f47" stroke-width="1.5"/>
    <line x1="40" y1="90" x2="95" y2="90" stroke="#8b6f47" stroke-width="1.5"/>
    <line x1="40" y1="110" x2="100" y2="110" stroke="#8b6f47" stroke-width="1.5"/>
    <line x1="40" y1="120" x2="100" y2="120" stroke="#8b6f47" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="98" y2="130" stroke="#8b6f47" stroke-width="1.5"/>
  </g>
  
  <!-- Shadow effect -->
  <ellipse cx="128" cy="246" rx="90" ry="8" fill="black" opacity="0.1"/>
